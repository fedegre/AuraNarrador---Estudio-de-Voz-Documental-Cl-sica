    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      // Runtime constraint: HMR is disabled in AI Studio; ignore harmless Vite dev WebSocket errors
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('WebSocket') || event.message.includes('@vite/client') || event.message.includes('createWebSocketModuleRunnerTransport'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          (typeof event.reason === 'string' && (event.reason.includes('WebSocket') || event.reason.includes('@vite/client'))) ||
          (event.reason.message && (event.reason.message.includes('WebSocket') || event.reason.message.includes('@vite/client') || event.reason.message.includes('createWebSocketModuleRunnerTransport')))
        )) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
